[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Public settings are intentionally present in UI/source. Credentials stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "APP_NAME,APP_URL,ALLOWED_ORIGIN,OPENAI_MODEL,OPERATOR_NAME,SUPPORT_CONTACT,TARGET_AGE_NOTICE,DATA_PROCESSING_NOTICE,HOST_LOG_POLICY_CONFIRMED,SESSION_MINUTE_LIMIT,SESSION_DAY_LIMIT,GLOBAL_DAY_LIMIT,MAX_INPUT_CHARS,MAX_HISTORY_CHARS,MAX_OUTPUT_TOKENS,SURVEY_RETENTION_NOTICE,SURVEY_DAY_LIMIT,NETLIFY_FORMS_ENABLED"
