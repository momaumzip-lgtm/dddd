<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>마음 한걸음 설문 접수</title>
  </head>
  <body>
    <!-- Static schema for Netlify's build-time detection. The app submits through /api/survey. -->
    <form
      name="maumzip-experience"
      method="POST"
      action="/survey-received.html"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="maumzip-experience" />
      <input name="bot-field" />
      <input name="submissionId" />
      <input name="surveyVersion" />
      <input name="선택동의" />
      <input name="answers" />
      <input name="entryRoute" />
      <input name="selfUnderstanding" />
      <input name="organizationHelpfulness" />
      <input name="judgmentOrAwkwardness" />
      <input name="awkwardnessDetail" />
      <input name="disclosureBurden" />
      <input name="conversationPace" />
      <input name="reuseFrequency" />
      <input name="recommendationIntent" />
      <input name="improvementSuggestions" />
      <input name="qrAccessEase" />
      <input name="qrDiaryMotivation" />
      <input name="qrFlowFeedback" />
    </form>
    <p>설문은 <a href="/">마음 한걸음</a>에서 참여할 수 있어요.</p>
  </body>
</html>
